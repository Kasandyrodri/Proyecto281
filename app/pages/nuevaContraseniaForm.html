<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');

        * {
            margin: 0;
            padding: 0;
            outline: none;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            color: #515a6e;
        }

        html,
        body {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px;
            height: 100%;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: Roboto, sans-serif;
            color: #515a6e;
            background-color: #889E73;
        }

        .container {
            max-width: 800px;
            background: #e6e6e6;
            width: 800px;
            padding: 25px 40px 10px 40px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
        }

        .container .text {
            text-align: center;
            font-weight: 600;
            font-size: 41px;
            font-family: 'Poppins', sans-serif;
            background: #515a6e;
            background-clip: text;
            /* Estándar */
            -webkit-background-clip: text;
            /* Para compatibilidad con navegadores basados en WebKit */
            -webkit-text-fill-color: transparent;
        }

        .container form {
            padding: 30px 0 0 0;
            border-radius: 100px;
        }

        .container form .form-row {
            display: flex;
            margin: 22px 0;

        }

        form .form-row .input-data {
            width: 100%;
            height: 41px;
            margin: 0 5px;
            position: relative;

        }

        form .form-row .textarea {
            height: 70px;
        }

        .input-data {
            background: #e6e6e6;
        }

        .input-data input,
        .textarea textarea {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            font-size: 17px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.12);
            background: transparent;
        }

        .input-data input:focus~label,
        .textarea textarea:focus~label,
        .input-data input:valid~label,
        .textarea textarea:valid~label {
            transform: translateY(-30px);
            font-size: 14px;
            color: #6c8e9c;
        }

        .textarea textarea {
            resize: none;
            padding-top: 10px;
        }

        .input-data label {
            position: absolute;
            pointer-events: none;
            bottom: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: transparent;
            border-radius: 10px;
            padding: 2px;

        }

        .textarea label {
            width: 100%;
            bottom: 40px;
            background: #e6e6e6;
        }

        .input-data .underline {
            position: absolute;
            bottom: 0;
            height: 2px;
            width: 100%;
            background-color: #9b9790;
        }

        .input-data .underline:before {
            position: absolute;
            content: "";
            height: 2px;
            width: 100%;
            background: #9b9790;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.3s ease;
            background-color: transparent;
        }

        .input-data input:focus~.underline:before,
        .input-data input:valid~.underline:before,
        .textarea textarea:focus~.underline:before,
        .textarea textarea:valid~.underline:before {
            transform: scale(1);
        }

        .submit-btn .input-data {
            overflow: hidden;
            height: 45px !important;
            width: 25% !important;
        }

        .submit-btn .input-data .inner {
            height: 100%;
            width: 300%;
            position: absolute;
            left: -100%;
            background-color: #889E73;
        }

        .submit-btn .input-data:hover .inner {
            left: 0;
        }

        .submit-btn .input-data input {
            background: none;
            border: none;
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 700px) {
            * {
                margin: 0;
                padding: 0px 40px;
                outline: none;
                box-sizing: border-box;
                font-family: 'Poppins', sans-serif;
                color: #515a6e;

            }

            .container .text {
                font-size: 30px;
            }

            .container form {
                padding: 10vh 0px 0 5vh;
            }

            .container form .form-row {
                display: block;

            }

            form .form-row .input-data {
                margin: 35px 0 !important;
            }

            .submit-btn .input-data {
                width: 50% !important;
                padding-left: 50px;
            }
        }

        .error {
            color: rgb(105, 11, 34);
            text-align: center;
        }

        .escondido {
            display: none;
        }

        .contrasenia {
            color: rgb(105, 11, 34);
            text-align: left;
        }

        #errorMensaje2 {
            text-align: leftz;
        }

        .input-data select:focus~.underline {
            background-color: #6c8e9c;
        }


        /* Estilos para el input tipo date */
        input[type="date"] {
            width: 100%;
            height: 41px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #e6e6e6;
            font-size: 17px;
            color: #515a6e;
            font-family: 'Poppins', sans-serif;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            position: relative;
        }

        /* Evitar que se muestre el valor predeterminado cuando no hay fecha seleccionada */
        input[type="date"]::-webkit-datetime-edit {
            color: transparent;
        }

        input[type="date"]:focus::-webkit-datetime-edit {
            color: #515a6e;
        }

        .input_eye {
            position: absolute;
            bottom: 0;
            right: 10px;
            width: 25px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text">
            Recupera tu contraseña
        </div>
        <form action="#" id="nueva-contrasenia-form">
            <div class="form-row">
                <div class="input-data">
                    <input type="password" name="contrasenia" id="contrasenia" required>
                    <div class="underline"></div>
                    <label for="contrasenia">Establezca una nueva contraseña</label>
                    <!-- Ojo -->
                    <span class="input_eye" onclick="mostrarContrasenia()">
                        <i id="ojo1" class="material-icons">visibility_off</i>
                    </span>
                    <p class="error escondido" id="errorMensaje2">Validacion de contraseña</p>
                </div>
                <div class="input-data">
                    <input type="password" name="contrasenia_confirmar" id="contrasenia_confirmar" required>
                    <div class="underline"></div>
                    <label for="contrasenia_confirmar">Repita la contrasenia</label>
                    <span class="input_eye" onclick="mostrarContraseniaRepetida()">
                        <i id="ojo2" class="material-icons">visibility_off</i>
                    </span>
                    <p class="error escondido" id="errorMensaje">Las contraseñas no coinciden</p>
                </div>
            </div>
            <p class="error escondido">Error al iniciar sesión</p>
            <div class="form-row submit-btn">
                <div class="input-data">
                    <div class="inner"></div>
                    <input type="submit" value="Recuperar">
                </div>
            </div>
        </form>
    </div>
    <script>
        const contrasenia = document.getElementById("contrasenia");
        const confirmaContrasenia = document.getElementById("contrasenia_confirmar");

        function validarContraseniaRepetida() {
            const errorMensaje = document.getElementById("errorMensaje");
            if (confirmaContrasenia.value !== contrasenia.value) {
                errorMensaje.style.display = "block"; // Muestra el mensaje de error
            } else {
                errorMensaje.style.display = "none"; // Oculta el mensaje de error
            }
        }
        // Ejecutar la validación mientras escribe
        confirmaContrasenia.addEventListener("input", validarContraseniaRepetida);

        // Ejecutar la validación al salir del input
        confirmaContrasenia.addEventListener("blur", validarContraseniaRepetida);

        // Validar que la contrasenia cumpla con los requisitos
        function validarContrasenia() {
            const errorMensaje = document.getElementById("errorMensaje2");
            const valor = contrasenia.value;
            let errores = [];

            if (!/[a-z]/.test(valor)) errores.push("Debe tener al menos una minúscula.");
            if (!/[A-Z]/.test(valor)) errores.push("Debe tener al menos una mayúscula.");
            if (!/\d/.test(valor)) errores.push("Debe tener al menos un número.");
            if (!/[^a-zA-Z0-9]/.test(valor)) errores.push("Debe tener al menos un carácter especial.");
            if (valor.length < 8) errores.push("Debe tener mínimo 8 caracteres.");
            if (valor.length > 15) errores.push("No debe superar los 15 caracteres.");

            if (errores.length === 0) {
                errorMensaje.textContent = "¡Contraseña válida!";
                errorMensaje.classList.add("valido");
            } else {
                errorMensaje.textContent = errores[0]; // Solo muestra el primer error
                errorMensaje.style.display = "block";
                errorMensaje.classList.remove("valido");
            }
        }

        contrasenia.addEventListener("input", validarContrasenia);
        contrasenia.addEventListener("blur", validarContrasenia);
        // Obtener el token de la URL
        const token = window.location.pathname.split('/')[2];
        console.log("Token recibido:", token);

        const mensajeError = document.getElementsByClassName("error")[0];

        document.getElementById("nueva-contrasenia-form").addEventListener("submit", async (e) => {
            e.preventDefault(); // Evita que envie el formulario para realizar pruebas
            console.log(e);
            const contrasenia = document.getElementById("contrasenia").value;

            // Conectando con el backend
            const res = await fetch("http://localhost:4000/api/cambiar_contrasenia", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contrasenia: contrasenia,
                    token: token
                })
            });
            if (!res.ok) {
                const data = await res.json();
                mensajeError.textContent = data.message;
                return mensajeError.classList.toggle("escondido", false)
            };
            const resJson = await res.json();

            if (resJson.message) {
                alert(resJson.message);
                window.location.href = '/';
            }
        });
        function mostrarContrasenia() {
            const constrasenia = document.getElementById("contrasenia");
            const ojo = document.getElementById("ojo1");

            if (constrasenia.type === "password") {
                constrasenia.type = "text";
                ojo.innerHTML = "visibility";
            } else {
                constrasenia.type = "password";
                ojo.innerHTML = "visibility_off";
            }
        }
        function mostrarContraseniaRepetida() {
            const constrasenia = document.getElementById("contrasenia_confirmar");
            const ojo = document.getElementById("ojo2");

            if (constrasenia.type === "password") {
                constrasenia.type = "text";
                ojo.innerHTML = "visibility";
            } else {
                constrasenia.type = "password";
                ojo.innerHTML = "visibility_off";
            }
        }
    </script>
</body>

</html>
